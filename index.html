<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stopwatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1b2e;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
    }

    /* 背景グロー */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(228,108,10,0.12) 0%, transparent 65%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      left: 30%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(28,50,83,0.6) 0%, transparent 65%);
      pointer-events: none;
    }

    .card {
      position: relative;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      padding: 52px 64px 48px;
      text-align: center;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05) inset,
        0 32px 80px rgba(0,0,0,0.5);
      min-width: 380px;
      z-index: 1;
    }

    .title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 40px;
    }

    /* リング */
    .ring-wrap {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto 36px;
    }

    .ring-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: rgba(255,255,255,0.06);
      stroke-width: 3;
    }

    .ring-progress {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 628;
      stroke-dashoffset: 628;
      transition: stroke-dashoffset 0.1s linear;
    }

    .time-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .display {
      font-family: 'DM Mono', monospace;
      font-size: 58px;
      font-weight: 300;
      letter-spacing: 0.02em;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .ms {
      font-family: 'DM Mono', monospace;
      font-size: 22px;
      color: rgba(255,255,255,0.35);
      font-weight: 300;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    /* ステータスドット */
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      margin: 0 auto 32px;
      transition: background 0.3s;
    }

    .status-dot.running {
      background: #E46C0A;
      box-shadow: 0 0 10px rgba(228,108,10,0.7);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      border: none;
      border-radius: 50px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: transform 0.12s, box-shadow 0.12s, background 0.2s;
    }

    button:active { transform: scale(0.96); }

    #btn-start {
      background: linear-gradient(135deg, #E46C0A, #f58520);
      color: #fff;
      padding: 15px 40px;
      min-width: 130px;
      box-shadow: 0 4px 20px rgba(228,108,10,0.45);
    }

    #btn-start:hover {
      box-shadow: 0 6px 28px rgba(228,108,10,0.6);
      transform: translateY(-1px);
    }

    #btn-start.stop-mode {
      background: linear-gradient(135deg, #1C3253, #2a4a73);
      box-shadow: 0 4px 20px rgba(28,50,83,0.5);
    }

    #btn-lap, #btn-reset {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
      padding: 15px 24px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    #btn-lap:hover:not(:disabled), #btn-reset:hover {
      background: rgba(255,255,255,0.14);
      transform: translateY(-1px);
    }

    #btn-lap:disabled { opacity: 0.25; cursor: default; transform: none; }

    /* ラップ */
    .laps {
      margin-top: 36px;
      max-height: 180px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }

    .laps:empty { display: none; }

    .laps::-webkit-scrollbar { width: 4px; }
    .laps::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

    .laps-header {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 4px;
    }

    .lap-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 13px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .lap-num { color: rgba(255,255,255,0.3); font-size: 12px; }

    .lap-split {
      font-family: 'DM Mono', monospace;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
    }

    .lap-total {
      font-family: 'DM Mono', monospace;
      color: rgba(255,255,255,0.9);
      font-weight: 400;
    }

    .lap-item.fastest .lap-total { color: #4ade80; }
    .lap-item.slowest .lap-total { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Stopwatch</div>

    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 220 220">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#E46C0A" />
            <stop offset="100%" stop-color="#f58520" />
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="110" cy="110" r="100" />
        <circle class="ring-progress" id="ring" cx="110" cy="110" r="100" />
      </svg>
      <div class="time-inner">
        <div class="display" id="display">00:00</div>
        <div class="ms" id="display-ms">.00</div>
      </div>
    </div>

    <div class="status-dot" id="status-dot"></div>

    <div class="controls">
      <button id="btn-start">Start</button>
      <button id="btn-lap" disabled>Lap</button>
      <button id="btn-reset">Reset</button>
    </div>

    <div class="laps" id="laps"></div>
  </div>

  <script>
    let startTime = 0;
    let elapsed = 0;
    let rafId = null;
    let running = false;
    let lapCount = 0;
    let lastLapElapsed = 0;
    let lapTimes = [];

    const display    = document.getElementById('display');
    const displayMs  = document.getElementById('display-ms');
    const btnStart   = document.getElementById('btn-start');
    const btnLap     = document.getElementById('btn-lap');
    const btnReset   = document.getElementById('btn-reset');
    const lapsEl     = document.getElementById('laps');
    const statusDot  = document.getElementById('status-dot');
    const ring       = document.getElementById('ring');

    const RING_CIRC = 2 * Math.PI * 100;

    function pad(n, len) {
      return String(Math.floor(n)).padStart(len, '0');
    }

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const centis  = Math.floor((ms % 1000) / 10);
      return {
        main: `${pad(minutes, 2)}:${pad(seconds, 2)}`,
        ms:   `.${pad(centis, 2)}`
      };
    }

    function updateRing(ms) {
      const seconds = (ms / 1000) % 60;
      const progress = seconds / 60;
      ring.style.strokeDashoffset = RING_CIRC * (1 - progress);
    }

    function render() {
      const t = formatTime(elapsed);
      display.textContent  = t.main;
      displayMs.textContent = t.ms;
      updateRing(elapsed);
    }

    function tick() {
      elapsed = Date.now() - startTime;
      render();
      rafId = requestAnimationFrame(tick);
    }

    function rebuildLaps() {
      lapsEl.innerHTML = '';
      if (lapTimes.length === 0) return;

      const min = Math.min(...lapTimes.map(l => l.split));
      const max = Math.max(...lapTimes.map(l => l.split));

      const header = document.createElement('div');
      header.className = 'laps-header';
      header.innerHTML = '<span>Lap</span><span>Split</span><span>Total</span>';
      lapsEl.appendChild(header);

      [...lapTimes].reverse().forEach((lap, i) => {
        const item = document.createElement('div');
        item.className = 'lap-item';
        if (lapTimes.length > 1) {
          if (lap.split === min) item.classList.add('fastest');
          else if (lap.split === max) item.classList.add('slowest');
        }
        const ts = formatTime(lap.split);
        const tt = formatTime(lap.total);
        item.innerHTML = `
          <span class="lap-num">${lap.num}</span>
          <span class="lap-split">${ts.main}${ts.ms}</span>
          <span class="lap-total">${tt.main}${tt.ms}</span>`;
        lapsEl.appendChild(item);
      });
    }

    btnStart.addEventListener('click', () => {
      if (!running) {
        startTime = Date.now() - elapsed;
        rafId = requestAnimationFrame(tick);
        running = true;
        btnStart.textContent = 'Stop';
        btnStart.classList.add('stop-mode');
        statusDot.classList.add('running');
        btnLap.disabled = false;
      } else {
        cancelAnimationFrame(rafId);
        running = false;
        btnStart.textContent = 'Start';
        btnStart.classList.remove('stop-mode');
        statusDot.classList.remove('running');
        btnLap.disabled = true;
      }
    });

    btnLap.addEventListener('click', () => {
      if (!running) return;
      lapCount++;
      const splitMs = elapsed - lastLapElapsed;
      lastLapElapsed = elapsed;
      lapTimes.push({ num: lapCount, split: splitMs, total: elapsed });
      rebuildLaps();
    });

    btnReset.addEventListener('click', () => {
      cancelAnimationFrame(rafId);
      running = false;
      elapsed = 0;
      lapCount = 0;
      lastLapElapsed = 0;
      lapTimes = [];
      render();
      lapsEl.innerHTML = '';
      btnStart.textContent = 'Start';
      btnStart.classList.remove('stop-mode');
      statusDot.classList.remove('running');
      btnLap.disabled = true;
    });
  </script>
</body>
</html>
